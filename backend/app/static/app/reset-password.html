<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Beevarium - Nouveau mot de passe</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="wrap">
    <section class="card stack login-card">
      <p class="eyebrow">Beevarium</p>
      <h2>Choisir un nouveau mot de passe</h2>
      <p class="login-intro">Saisissez votre nouveau mot de passe. Il doit contenir au moins 12 caracteres.</p>

      <div id="form-block">
        <div class="row">
          <label for="password">Nouveau mot de passe</label>
          <span class="password-field"><input id="password" type="password" autocomplete="new-password"><button class="password-toggle" type="button" data-password-for="password" aria-label="Afficher le mot de passe" aria-pressed="false"></button></span>
        </div>
        <div class="row">
          <label for="password-confirm">Confirmation</label>
          <span class="password-field"><input id="password-confirm" type="password" autocomplete="new-password"><button class="password-toggle" type="button" data-password-for="password-confirm" aria-label="Afficher le mot de passe" aria-pressed="false"></button></span>
        </div>
        <div class="actions">
          <button id="btn-submit" class="btn">Valider</button>
        </div>
      </div>

      <p class="hint" id="hint"></p>
      <p class="login-secondary"><a href="./index.html">Retour a la connexion</a></p>
    </section>
  </main>

  <script src="./reset-password.js"></script>
</body>
</html>
