---
# Configuration du VPS (R14). Lancer via scripts/linux/ansible_vps.sh, d'abord en --check.
- name: Configuration du VPS Beevarium
  hosts: vps
  become: true
  roles:
    - { role: base, tags: [base] }
    - { role: ssh_hardening, tags: [ssh] }
    - { role: firewall, tags: [firewall] }
    - { role: docker, tags: [docker] }
    - { role: caddy, tags: [caddy] }
    - { role: beevarium_user, tags: [user] }
    - { role: lynis, tags: [never, audit] }
