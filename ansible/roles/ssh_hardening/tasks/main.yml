---
# Garde-fou : ne jamais couper le mot de passe sans cle autorisee.
- name: Lire les cles autorisees de l'administrateur
  ansible.builtin.slurp:
    src: "/home/{{ ssh_hardening_admin_user }}/.ssh/authorized_keys"
  register: ssh_hardening_authorized_keys
  failed_when: false
  changed_when: false

- name: Refuser de durcir SSH sans cle publique
  ansible.builtin.assert:
    that:
      - ssh_hardening_authorized_keys.content is defined
      - (ssh_hardening_authorized_keys.content | b64decode) is regex('(?m)^(ssh-|ecdsa-|sk-)')
    fail_msg: "Aucune cle dans ~{{ ssh_hardening_admin_user }}/.ssh/authorized_keys : durcissement SSH annule."

- name: Repertoire de separation de privileges (requis par sshd -t)
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    mode: "0755"

- name: Configuration sshd durcie (action A1)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-beevarium.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      PubkeyAuthentication yes
      MaxAuthTries {{ ssh_hardening_max_auth_tries }}
    mode: "0644"
    owner: root
    group: root
    validate: /usr/sbin/sshd -t -f %s
  notify: Recharger sshd

- name: Jail fail2ban sshd
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/beevarium-sshd.local
    content: |
      [sshd]
      enabled = true
      backend = systemd
    mode: "0644"
    owner: root
    group: root
  notify: Redemarrer fail2ban

- name: Activer fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
